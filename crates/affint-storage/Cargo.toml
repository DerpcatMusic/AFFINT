[package]
name = "affint-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Bounded editable AFFINT archives and atomic native persistence"

[dependencies]
affint-document = { path = "../affint-document" }
png = "=0.18.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.11.0"
tempfile = "=3.27.0"
thiserror = "=2.0.21"

[dev-dependencies]
kurbo = "=0.13.1"

[lints]
workspace = true
